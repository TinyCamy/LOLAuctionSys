{% extends 'base.html' %}
{% block title %}创建比赛房间 | LOL内战{% endblock %}
{% block content %}
<section class="card"><h1>创建比赛房间</h1><p>比赛 ID 将按日期和当日序号生成；人数必须为偶数，A、B 两队各占一半。</p><form method="post" class="profile-form"><label>比赛名称<input name="name" maxlength="80" required value="{{ request.form.name|default('') }}"></label><div class="form-row"><label>比赛局数<select name="game_format">{% for value in game_formats %}<option value="{{ value }}">{{ value }}</option>{% endfor %}</select></label><label>比赛人数（偶数）<input name="player_count" type="number" min="4" max="100" step="2" required value="{{ request.form.player_count|default('10') }}"></label></div><div class="form-row"><label>队长选择<select name="captain_selection">{% for value in captain_selections %}<option value="{{ value }}">{{ value }}</option>{% endfor %}</select></label><label>队员选择<select name="player_selection">{% for value in player_selections %}<option value="{{ value }}">{{ value }}</option>{% endfor %}</select></label></div><div class="form-row"><label>拍卖资金（W）<input name="auction_budget" type="number" min="0.01" step="0.01" required value="500.00"></label><label>房间密码（可选）<input name="room_password" type="password" maxlength="64" placeholder="留空则不设密码"></label></div><label class="switch-label">根据段位调整拍卖金额<span class="switch"><input name="rank_adjustment" type="checkbox" value="1"><span>启用后，两位队长每相差一个段位，较低段位队长的拍卖金额提高 10%</span></span></label><input type="hidden" name="rank_adjustment" value="0"><button>创建并进入房间</button></form></section>
{% endblock %}
